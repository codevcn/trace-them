<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trace Them — Brand Logo Showcase (6 SVG Concepts)</title>
<style>
  :root {
    --surface: #FFFFFF;
    --surface-sunken: #F7F8F9;
    --text: #172B4D;
    --text-subtle: #44546F;
    --border: rgba(9, 30, 66, 0.14);
    --brand: #0C66E4;
    --brand-hover: #0055CC;
    --shadow: 0 1px 2px rgba(9, 30, 66, 0.2), 0 0 1px rgba(9, 30, 66, 0.28);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface-sunken);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica Neue", sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .topbar h1 { margin: 0; font-size: 18px; font-weight: 600; }
  .topbar p { margin: 2px 0 0; font-size: 12.5px; color: var(--text-subtle); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn {
    height: 32px;
    padding: 0 12px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn:hover { background: #F1F2F4; }
  .btn.is-active {
    background: #E9F2FF;
    border-color: #85B8FF;
    color: var(--brand);
    font-weight: 600;
  }
  .container { max-width: 1320px; margin: 0 auto; padding: 24px 28px 48px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 20px;
  }
  .card {
    background: var(--surface);
    border-radius: 8px;
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .stage {
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    border-bottom: 1px solid var(--border);
    transition: background-color 0.2s ease, color 0.2s ease;
  }
  body[data-theme="light"] .stage { background: #FFFFFF; color: #0C66E4; }
  body[data-theme="dark"] .stage { background: #101214; color: #579DFF; }
  body[data-theme="brand"] .stage { background: #0C66E4; color: #FFFFFF; }
  body[data-theme="mono"] .stage { background: #FFFFFF; color: #172B4D; }

  .lockup {
    display: inline-flex;
    align-items: center;
    gap: 14px;
  }
  .hero-icon { width: 84px; height: 84px; }
  .wordmark {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  body[data-theme="light"] .wordmark { color: #172B4D; }
  body[data-theme="dark"] .wordmark { color: #F7F8F9; }
  body[data-theme="brand"] .wordmark { color: #FFFFFF; }
  body[data-theme="mono"] .wordmark { color: #172B4D; }

  .scales {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 8px 14px;
    border-radius: 6px;
    background: rgba(127, 127, 127, 0.08);
  }
  .scale-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 10.5px;
    opacity: 0.78;
  }
  .body {
    padding: 18px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .card-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 3px;
    background: #E9F2FF;
    color: var(--brand);
    text-transform: uppercase;
  }
  .rationale {
    margin: 0;
    color: var(--text-subtle);
    font-size: 13.5px;
    flex: 1;
  }
  .card-actions {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }
  .btn-primary {
    background: var(--brand);
    border-color: var(--brand);
    color: #FFFFFF;
  }
  .btn-primary:hover { background: var(--brand-hover); }
</style>
</head>
<body data-theme="light">
<header class="topbar">
  <div>
    <h1>Trace Them — Logo Design Set</h1>
    <p>6 geometric SVG variants (<code>viewBox="0 0 100 100"</code>, <code>currentColor</code>) built for CLI, HTML reports, Windows icon, and docs.</p>
  </div>
  <div class="controls" role="group" aria-label="Surface theme preview">
    <button type="button" class="btn is-active" data-set-theme="light">Atlassian Light</button>
    <button type="button" class="btn" data-set-theme="brand">Brand Blue (#0C66E4)</button>
    <button type="button" class="btn" data-set-theme="dark">Dark Mode</button>
    <button type="button" class="btn" data-set-theme="mono">Monochrome Slate</button>
  </div>
</header>

<main class="container">
  <div class="grid" id="logo-grid"></div>
</main>

<script>
const VARIANTS = [
  {
    id: "01-signal-radar",
    title: "01. Signal Radar",
    tag: "Discovery",
    rationale: "Concentric radar arcs and a directional sweep trace 3 distinct signal dots across public platforms without assuming a single identity.",
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 50 12 A 38 38 0 1 1 17.1 69" stroke-width="5.5"/>
    <path d="M 50 25 A 25 25 0 1 1 26.8 59.5" stroke-width="5"/>
    <path d="M 50 50 L 76.5 23.5" stroke-width="5.5"/>
  </g>
  <g fill="currentColor">
    <circle cx="50" cy="50" r="7.5"/>
    <circle cx="76.5" cy="23.5" r="5"/>
    <circle cx="24" cy="28" r="4"/>
    <circle cx="74" cy="76" r="4"/>
  </g>
</svg>`
  },
  {
    id: "02-node-constellation",
    title: "02. Identity Node Constellation",
    tag: "Evidence Graph",
    rationale: "Connects a central query node to solid verified matches and dashed/hollow unverified nodes, visualizing Trace Them's strict separation of existence vs ownership.",
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 24 72 Q 34 46, 50 50 T 76 24" stroke-width="5.5"/>
    <path d="M 50 50 L 76 72" stroke-width="5" stroke-dasharray="2 9"/>
    <path d="M 50 50 L 26 26" stroke-width="5"/>
    <circle cx="76" cy="72" r="8" stroke-width="5"/>
    <circle cx="26" cy="26" r="7.5" stroke-width="5"/>
  </g>
  <g fill="currentColor">
    <circle cx="50" cy="50" r="10.5"/>
    <circle cx="76" cy="24" r="8"/>
    <circle cx="24" cy="72" r="7.5"/>
  </g>
</svg>`
  },
  {
    id: "03-evidence-shield",
    title: "03. Evidence Policy Shield",
    tag: "Trust & Policy",
    rationale: "Combines a clean security shield with an inner inspection lens, reflecting Trace Them's public-source policy guardrails and evidence-first output.",
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 50 11 L 82 23 V 48 C 82 68.5, 67.5 82.5, 50 89 C 32.5 82.5, 18 68.5, 18 48 V 23 Z" stroke-width="5.5"/>
    <circle cx="47" cy="48" r="14.5" stroke-width="5"/>
    <path d="M 57.5 58.5 L 68 69" stroke-width="5.5"/>
  </g>
  <circle cx="47" cy="48" r="4.5" fill="currentColor"/>
</svg>`
  },
  {
    id: "04-monogram-tt",
    title: "04. Architectural Monogram TT",
    tag: "App Icon",
    rationale: "Interlocking geometric 'TT' inside a rounded app tile with a beacon dot — built for razor-sharp legibility as a Windows .exe icon, favicon, or terminal badge.",
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <rect x="12" y="12" width="76" height="76" rx="18" stroke-width="5.5"/>
    <path d="M 27 34 H 57" stroke-width="6.5"/>
    <path d="M 42 34 V 71" stroke-width="6.5"/>
    <path d="M 52 50 H 75" stroke-width="6.5"/>
    <path d="M 63.5 50 V 71" stroke-width="6.5"/>
  </g>
  <circle cx="69" cy="34" r="5" fill="currentColor"/>
</svg>`
  },
  {
    id: "05-dot-matrix-lens",
    title: "05. Dot Matrix Probe",
    tag: "Matrix Sweep",
    rationale: "Structured dot matrix representing 451+ target sites with an active diagonal probe beam and central focus ring capturing only matching public profiles.",
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <g fill="currentColor" opacity="0.28">
    <circle cx="20" cy="20" r="4"/><circle cx="40" cy="20" r="4"/><circle cx="60" cy="20" r="4"/>
    <circle cx="20" cy="40" r="4"/><circle cx="80" cy="40" r="4"/>
    <circle cx="20" cy="60" r="4"/><circle cx="80" cy="60" r="4"/>
    <circle cx="40" cy="80" r="4"/><circle cx="60" cy="80" r="4"/><circle cx="80" cy="80" r="4"/>
  </g>
  <g fill="currentColor">
    <circle cx="80" cy="20" r="6"/><circle cx="40" cy="40" r="5.5"/><circle cx="60" cy="40" r="5.5"/>
    <circle cx="40" cy="60" r="5.5"/><circle cx="60" cy="60" r="5.5"/><circle cx="20" cy="80" r="6"/>
  </g>
  <path d="M 20 80 L 40 60 M 60 40 L 80 20" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="19" stroke="currentColor" stroke-width="4.5"/>
</svg>`
  },
  {
    id: "06-orbital-footprint",
    title: "06. Orbital Footprint",
    tag: "Footprint",
    rationale: "Split orbital perimeter framing a minimalist digital-print arc and dual anchor nodes — evokes cross-platform footprint tracing with balanced symmetry.",
    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <g stroke="currentColor" stroke-linecap="round">
    <path d="M 22 25 A 38 38 0 0 1 78 25" stroke-width="5.5"/>
    <path d="M 78 75 A 38 38 0 0 1 22 75" stroke-width="5.5"/>
    <path d="M 33 52 A 17 17 0 0 1 67 52" stroke-width="5"/>
    <path d="M 41 56 A 9 9 0 0 1 59 56" stroke-width="5"/>
    <path d="M 50 56 V 70" stroke-width="5"/>
  </g>
  <g fill="currentColor">
    <circle cx="15" cy="50" r="5.5"/><circle cx="85" cy="50" r="5.5"/><circle cx="50" cy="28" r="4.5"/>
  </g>
</svg>`
  }
];

const grid = document.getElementById("logo-grid");
VARIANTS.forEach((item) => {
  const card = document.createElement("article");
  card.className = "card";
  card.innerHTML = `
    <div class="stage">
      <div class="lockup">
        <div class="hero-icon">${item.svg}</div>
        <span class="wordmark">Trace Them</span>
      </div>
      <div class="scales">
        ${[16, 24, 36, 48].map((px) => `
          <div class="scale-item">
            <div style="width:${px}px;height:${px}px">${item.svg}</div>
            <span>${px}px</span>
          </div>
        `).join("")}
      </div>
    </div>
    <div class="body">
      <div class="card-head">
        <h2>${item.title}</h2>
        <span class="badge">${item.tag}</span>
      </div>
      <p class="rationale">${item.rationale}</p>
      <div class="card-actions">
        <button type="button" class="btn copy-btn">Copy SVG</button>
        <button type="button" class="btn btn-primary dl-btn">Download .svg</button>
      </div>
    </div>
  `;
  card.querySelector(".copy-btn").addEventListener("click", async (e) => {
    await navigator.clipboard.writeText(item.svg);
    e.target.textContent = "Copied!";
    setTimeout(() => { e.target.textContent = "Copy SVG"; }, 1400);
  });
  card.querySelector(".dl-btn").addEventListener("click", () => {
    const blob = new Blob([item.svg + "\n"], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${item.id}.svg`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });
  grid.appendChild(card);
});

document.querySelectorAll("[data-set-theme]").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.body.dataset.theme = btn.dataset.setTheme;
    document.querySelectorAll("[data-set-theme]").forEach((b) => b.classList.toggle("is-active", b === btn));
  });
});
</script>
</body>
</html>
