[tox]
requires =
    tox >= 3
envlist =
    lint
    py314
    py313
    py312
    py311
    py310

[testenv]
description = Attempt to build and install the package
deps =
    pytest
commands =
    python -m pytest -q

[testenv:offline]
deps =
    pytest
commands =
    python -m pytest -q -m "not online"

[testenv:lint]
description = Lint with Ruff
deps =
    ruff
commands =
    ruff check trace_them tests devel

[gh-actions]
python =
    3.14: py314
    3.13: py313
    3.12: py312
    3.11: py311
    3.10: py310
