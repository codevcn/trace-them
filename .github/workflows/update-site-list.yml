name: Build supported-site listing
on:
  workflow_dispatch:
  push:
    paths:
      - 'trace_them/resources/data.json'
      - 'trace_them/manifest.py'
permissions:
  contents: read
jobs:
  listing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python devel/site-list.py --output-dir output
      - uses: actions/upload-artifact@v4
        with:
          name: trace-them-site-list
          path: output/
# Generated files are artifacts; nothing is pushed to upstream repositories.
