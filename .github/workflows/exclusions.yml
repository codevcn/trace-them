name: Public-source policy audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'trace_them/manifest.py'
      - 'trace_them/resources/*.json'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . pytest
      - run: python -m pytest tests/test_manifest.py -q
# No scheduled live sweeps, registration checks, commits or branch pushes.
